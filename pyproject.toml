[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvc-clank"
version = "0.1.0"
description = "Operational, operator-triggered runtime for the completed CVC corpus"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cvc = "cvc.cli:main"
cvc-gui = "cvc.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]
